<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI YP Buddies</title>
    <!-- Google Fonts Link -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=keyboard_arrow_down_sentiment_satisfied_attach_file_arrow_upward" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="chatbot-popup">
        <!-- Chatbot Header -->
        <div class="chatbot-header">
            <div class="header-info">
                <img class="chatbot-logo" src="pict/logo-4.png" width="50" height="50" viewbox="0 0 1024 1024">
                <h2 class="logo-text">Chatbot SNBT</h2>
            </div>

            <!-- Login Admin -->
            <div class="admin-menu" id="adminBtn">
                <div class="admin-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="admin-user-icon">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>

                <div class="admin-tooltip">Login Admin</div>
            </div>
        </div>

        <!-- Chatbot Body -->
        <div class="chat-body">
            <div class="message bot-message">
                <img class="chatbot-avatar" src="pict/logo-3.png" width="50" height="50" viewbox="0 0 1024 1024">
                <div class="message-text">Hello There 👋</br>How can I help you today?</div>
            </div>
        </div>

        <!-- Chatbot Footer -->
        <div class="chat-footer">
            <form action="#" class="chat-form">
                <textarea placeholder="Message" class="message-input" id="message-input" name="message"
                    required></textarea>
                <div class="chat-controls">
                    <button type="submit" id="send-message" class="material-symbols-rounded">arrow_upward</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("adminBtn").addEventListener("click", () => {
            window.location.href = "/admin/login.html";
        });
    </script>
    <script src="newSolutionScript.js"></script>
</body>

</html>
