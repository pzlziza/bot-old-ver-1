<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - YP Buddies AI</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">
    <main>
        <div class="login-container">
            <h2>Admin</h2>
        </div>
        <form id="loginForm" class="login-input">
            <label for="inputEmail">Email</label>
            <input id="inputEmail" type="email" required></input>
            <label for="inputPassword">Password</label>
            <input id="inputPassword" type="password"></input>
            <button id="buttonLogin" type="submit">Login</button>
            <p class="forgot-password">
                <a href="register.html">Buat akun baru</a>
            </p>

        </form>
    </main>
    <div id="modal" class="pop-up-modal">
        <h2>Login gagal!</h2>
        <p>Silakan coba lagi</p>
    </div>
    <!-- <script src="js/init.js"></script> -->
    <script src="js/login.js"></script>
</body>

</html>
